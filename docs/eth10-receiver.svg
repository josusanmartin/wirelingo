<rect x="25" y="970" width="1390" height="119" rx="8" class="note" fill="#fff4d8" stroke="#b98727" stroke-width="1.5" />
<text x="45" y="1000" class="head" font-family="Arial, sans-serif" fill="#172638" font-size="20" font-weight="bold">Qualification required before claiming a working external link</text>
<text x="45" y="1028" font-family="Arial, sans-serif" fill="#172638" font-size="17">Scope differential input, SIGN, ENV, ACTIVE and ui0; measure thresholds, distortion, acquisition, release and rail excursions.</text>
<text x="45" y="1056" font-family="Arial, sans-serif" fill="#172638" font-size="17">Digital tests substitute ideal binary input. No built-board, analog compliance, continuous service or simultaneous TX/RX result exists.</text>
<text x="45" y="1080" class="small" font-family="Arial, sans-serif" fill="#172638" font-size="15">Protection, EMC, power-off connection and broader system termination require separate hardware review.</text>
</svg>
