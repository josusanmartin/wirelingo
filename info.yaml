# Tiny Tapeout project information
project:
  title:        "Wirelingo: programmable protocol emulator"
  author:       "Josu San Martin"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "PIO-style bit-banging cores with timeouts, edge waits, ALU, CRC tap and SRAM IMEM: UART/SPI/I2C, USB-LS, 10BASE-T TX, CAN"
  language:     "SystemVerilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_josusanmartin_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pe_chip.sv"
    - "pe_core.sv"
    - "pe_fifo.sv"
    - "pe_fifos.sv"
    - "pe_cg.sv"
    - "pe_imem.sv"
    - "pe_hostport.sv"
    - "pe_line.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "P16"
  ui[1]: "P17"
  ui[2]: "P18 / host quad IO0 in"
  ui[3]: "P19 / host quad IO1 in"
  ui[4]: "P20 / host quad IO2 in"
  ui[5]: "host MOSI / quad IO3 in"
  ui[6]: "host SCK"
  ui[7]: "host CS_n"

  # Outputs
  uo[0]: "P8"
  uo[1]: "P9"
  uo[2]: "P10"
  uo[3]: "P11"
  uo[4]: "P12 / host quad IO0 out during reads"
  uo[5]: "P13 / host quad IO1 out during reads"
  uo[6]: "P14 / host quad IO2 out during reads"
  uo[7]: "host MISO / quad IO3 out"

  # Bidirectional pins
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"

# Do not change!
yaml_version: 6
