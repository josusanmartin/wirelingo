name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # Each suite writes its own results file; check_results.py fails on a
      # missing file, a wrong test count, or any failure, error or skip.
      - name: Top-level tests through the SPI port (tapeout config, SRAM model)
        run: |
          cd test
          make clean
          make COCOTB_RESULTS_FILE=top.xml
          python3 check_results.py top.xml 10

      - name: Firmware tests on the model, assembler and driver tests
        run: |
          pip install pytest
          PYTHONPATH=tools python -m pytest -q test/model

      - name: Lockstep RTL vs model, tapeout config (2 cores, 2 SRAM banks, 8-deep FIFOs)
        run: |
          cd test
          LOCKSTEP_SEEDS=20 LOCKSTEP_CYCLES=1000 PE_NCORES=2 PE_NBANKS=2 PE_FIFO_LOG2=3 \
            make TB=chip COCOTB_RESULTS_FILE=lockstep_tapeout.xml
          python3 check_results.py lockstep_tapeout.xml 3

      - name: Lockstep RTL vs model, 4-core flop build
        run: |
          cd test
          LOCKSTEP_SEEDS=10 LOCKSTEP_CYCLES=600 make TB=chip IMEM=flop COCOTB_RESULTS_FILE=lockstep_4core.xml
          python3 check_results.py lockstep_4core.xml 3

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/top.xml
            test/lockstep_tapeout.xml
            test/lockstep_4core.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/*.xml
            test/output/*
