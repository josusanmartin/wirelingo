name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # Each suite writes its own results file; check_results.py fails on a
      # missing file, a wrong test count, or any failure, error or skip.
      - name: Top-level tests through the SPI port (tapeout config, SRAM model)
        run: |
          cd test
          make clean
          make COCOTB_RESULTS_FILE=top.xml
          python3 check_results.py top.xml $(grep -c '^@cocotb.test()' test.py)

      - name: Compiled RP2 PIO host transport through the SPI port
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_pio SIM_BUILD=sim_build/pio COCOTB_RESULTS_FILE=pio.xml
          python3 check_results.py pio.xml $(grep -c '^@cocotb.test()' test_pio.py)

      - name: Bounded board Ethernet receive service through the SPI port
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_eth_service SIM_BUILD=sim_build/eth_service COCOTB_RESULTS_FILE=eth_service.xml
          python3 check_results.py eth_service.xml $(grep -c '^@cocotb.test()' test_eth_service.py)

      - name: Post-freeze protocol firmware through the SPI port
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_post_freeze SIM_BUILD=sim_build/post_freeze COCOTB_RESULTS_FILE=post_freeze.xml
          python3 check_results.py post_freeze.xml $(grep -c '^@cocotb.test()' test_post_freeze.py)

      - name: Packed SPI framing through a serialized host
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_spi_packed_host SIM_BUILD=sim_build/spi_packed_host COCOTB_RESULTS_FILE=spi_packed_host.xml
          python3 check_results.py spi_packed_host.xml $(grep -c '^@cocotb.test()' test_spi_packed_host.py)

      - name: Preloaded SPI frames through a serialized host
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_spi_preloaded_host SIM_BUILD=sim_build/spi_preloaded_host COCOTB_RESULTS_FILE=spi_preloaded_host.xml
          python3 check_results.py spi_preloaded_host.xml $(grep -c '^@cocotb.test()' test_spi_preloaded_host.py)

      - name: Declared UART capture through a serialized host
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_uart_capture_host SIM_BUILD=sim_build/uart_capture_host COCOTB_RESULTS_FILE=uart_capture_host.xml
          python3 check_results.py uart_capture_host.xml $(grep -c '^@cocotb.test()' test_uart_capture_host.py)

      - name: UART/USB pair modes against the model, clock for clock
        run: |
          cd test
          make COCOTB_TEST_MODULES=test_usb_uart_rtl SIM_BUILD=sim_build/usb_uart_rtl COCOTB_RESULTS_FILE=usb_uart_rtl.xml
          python3 check_results.py usb_uart_rtl.xml $(grep -c '^@cocotb.test()' test_usb_uart_rtl.py)

      - name: Firmware tests on the model, assembler and driver tests
        run: |
          pip install pytest
          PYTHONPATH=tools python -m pytest -q test/model
          PYTHONPATH=tools python -m pe.mpy_bundle --check
          python flow/gen_config.py --preset submission --check

      - name: Lockstep RTL vs model, tapeout config (2 cores, 2 SRAM banks, 8-deep FIFOs)
        run: |
          cd test
          LOCKSTEP_SEEDS=40 LOCKSTEP_CYCLES=1000 PE_NCORES=2 PE_NBANKS=2 PE_FIFO_LOG2=3 \
            make TB=chip COCOTB_RESULTS_FILE=lockstep_tapeout.xml
          python3 check_results.py lockstep_tapeout.xml $(grep -c '^@cocotb.test()' test_lockstep.py)

      - name: Lockstep RTL vs model, 4-core flop build
        run: |
          cd test
          LOCKSTEP_GOALS=core LOCKSTEP_SEEDS=30 LOCKSTEP_CYCLES=1000 make TB=chip IMEM=flop COCOTB_RESULTS_FILE=lockstep_4core.xml
          python3 check_results.py lockstep_4core.xml $(grep -c '^@cocotb.test()' test_lockstep.py)

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/top.xml
            test/pio.xml
            test/eth_service.xml
            test/post_freeze.xml
            test/spi_packed_host.xml
            test/spi_preloaded_host.xml
            test/uart_capture_host.xml
            test/usb_uart_rtl.xml
            test/lockstep_tapeout.xml
            test/lockstep_4core.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/sim_build/**/wave.fst
            test/*.xml
            test/output/*

  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install OSS CAD Suite (yosys, sby, yices)
        uses: YosysHQ/setup-oss-cad-suite@v3

      # FIFOs, host port, core and line unit (docs/verification.md §3)
      - name: Formal proofs and covers
        run: |
          make -C formal 2>&1 | tee formal.log
          ! grep -E "DONE \((FAIL|ERROR|UNKNOWN)" formal.log
          test "$(grep -c 'DONE (PASS' formal.log)" -ge 7

  mutants:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt pytest

      # every planted bug must be caught by the test named next to it
      - name: Mutation check
        run: python3 test/mutants.py
